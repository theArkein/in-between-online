<title>In-Between: the card game</title>
<meta name="description" content="In-Between, the card game of betting on the card in the middle. Play on one screen or online with friends.">
<script>
/* Fit the page to the screen, always as landscape. Sizes come from JS (not vh/dvh) and are re-measured after
   every rotation, fullscreen change and browser-bar change, so nothing is left cropped or stale. A phone held
   upright is rotated in CSS (html.rot), because iPhone browsers cannot lock the screen to landscape. */
(function () {
  var de = document.documentElement, coarse = matchMedia("(pointer: coarse)"), last = { iw: 0, ih: 0 };
  function kbd() { var a = document.activeElement; return a && /^(INPUT|TEXTAREA)$/.test(a.tagName); }
  function measure() {
    var iw = window.innerWidth, ih = window.innerHeight;
    if (!iw || !ih) return;
    if (kbd() && iw === last.iw && ih < last.ih) return;          /* the on-screen keyboard only shrinks the height */
    if (iw === last.iw && ih === last.ih && de.dataset.fit) return;
    last.iw = iw; last.ih = ih;
    var rot = ih > iw && coarse.matches, W = rot ? ih : iw, H = rot ? iw : ih, c = de.classList;
    de.style.setProperty("--W", W + "px"); de.style.setProperty("--H", H + "px");
    de.style.setProperty("--vw", (W / 100) + "px"); de.style.setProperty("--vh", (H / 100) + "px");
    de.dataset.fit = W + "x" + H;
    c.toggle("rot", rot); c.toggle("land", W / H >= 1.2);
    c.toggle("narrow", W <= 430); c.toggle("short", H <= 660); c.toggle("xshort", H <= 540); c.toggle("xxshort", H <= 430);
  }
  function settle() { measure(); requestAnimationFrame(measure); [80, 250, 600, 1200].forEach(function (ms) { setTimeout(measure, ms); }); }
  window.__fit = { measure: measure, settle: settle };
  measure();
  addEventListener("resize", settle);
  addEventListener("orientationchange", settle);
  addEventListener("pageshow", settle);
  document.addEventListener("fullscreenchange", settle);
  document.addEventListener("webkitfullscreenchange", settle);
  if (window.visualViewport) visualViewport.addEventListener("resize", settle);
  addEventListener("pointerdown", measure, true);
  setInterval(measure, 1000);
  /* Show the page only once the fonts are in, so text does not jump when they arrive. */
  function ready() { de.classList.add("ready"); }
  function whenFonts() {
    if (!document.fonts || !document.fonts.load) { ready(); return; }
    var t = setTimeout(ready, 1500);
    Promise.all([document.fonts.load('800 20px "Bricolage Grotesque"'), document.fonts.load('600 16px "Instrument Sans"')]).then(function () { clearTimeout(t); ready(); }, ready);
  }
  document.addEventListener("DOMContentLoaded", whenFonts);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  box-sizing: border-box;
  --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px);
  --bg0: #e6efe9;
  --bg1: #c4d9cb;
  --panel: rgba(250, 253, 251, .82);
  --panel-solid: #f5f9f6;
  --panel2: rgba(20, 50, 36, .08);
  --ink: #10231a;
  --muted: #4a6254;
  --line: rgba(20, 50, 36, .2);
  --accent: #c58f1b;
  --accent-ink: #1c1405;
  --brass: #8a5f0a;
  --win: #0f6b3a;
  --lose: #b0372b;
  --focus: #1a64c4;
  --shadow: 0 10px 28px rgba(10, 40, 25, .22);
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg0: #050f0a; --bg1: #123325; --panel: rgba(14, 36, 26, .82); --panel-solid: #0f261b; --panel2: rgba(255, 255, 255, .06);
    --ink: #e8f2ec; --muted: #9fb8a8; --line: rgba(255, 255, 255, .15); --accent: #e4b64f; --accent-ink: #1c1405; --brass: #e4b64f;
    --win: #62d79c; --lose: #ff8c7a; --focus: #7db4ff; --shadow: 0 10px 28px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --bg0: #050f0a; --bg1: #123325; --panel: rgba(14, 36, 26, .82); --panel-solid: #0f261b; --panel2: rgba(255, 255, 255, .06);
  --ink: #e8f2ec; --muted: #9fb8a8; --line: rgba(255, 255, 255, .15); --accent: #e4b64f; --accent-ink: #1c1405; --brass: #e4b64f;
  --win: #62d79c; --lose: #ff8c7a; --focus: #7db4ff; --shadow: 0 10px 28px rgba(0, 0, 0, .45);
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; overflow: hidden; overscroll-behavior: none; background: #07140e; }
html.rot { --sat: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-right, 0px); --sal: env(safe-area-inset-bottom, 0px); }
body {
  position: fixed; left: 0; top: 0; width: var(--W, 100%); height: var(--H, 100%); margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.35;
  background: var(--bg0) radial-gradient(ellipse 90% 70% at 50% 38%, var(--bg1), var(--bg0) 75%);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
html.rot body { top: 100%; transform-origin: 0 0; transform: rotate(-90deg); }
html:not(.ready) #app, html:not(.ready) #sheet { opacity: 0; }
#app, #sheet { transition: opacity .18s ease-out; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
input { user-select: text; -webkit-user-select: text; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr { position: fixed; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

#app { position: relative; height: 100%; }
.view { position: absolute; inset: 0; }
#gameView { display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- top bar ---------- */
.hud { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; min-width: 0; }
.ibtn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow); }
.bank { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 4px 16px 4px 5px; border-radius: 999px; color: #eaf4ed; border: 1px solid rgba(255,255,255,.2); background: linear-gradient(180deg, #14604a, #0b3727); box-shadow: var(--shadow); }
.bank .chip { flex: none; width: 36px; height: 36px; border-radius: 50%; position: relative; background: repeating-conic-gradient(from -7.5deg, #f2eddc 0 15deg, #b8322a 15deg 30deg); box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.bank .chip::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #0f4a36; box-shadow: inset 0 0 0 2px #f2eddc; }
.bank small { display: block; font-size: 11px; opacity: .8; line-height: 1; }
.bank strong { font-family: var(--display); font-size: clamp(20px, calc(var(--vw, 1vw) * 5.4), 28px); line-height: 1.05; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; min-width: 0; }
.pill { display: grid; padding: 4px 10px; min-width: 50px; text-align: center; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.pill small { font-size: 10px; color: var(--muted); line-height: 1.2; }
.pill b { font-family: var(--display); font-size: 16px; line-height: 1.1; font-variant-numeric: tabular-nums; }
html.narrow .deckpill { display: none; }

/* ---------- main area ---------- */
#main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding: 0 10px 10px; min-height: 0; }
#stageWrap { position: relative; aspect-ratio: 7 / 5; min-height: 0; max-height: 100%; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
html.land #main { grid-template-columns: minmax(0, 1fr) minmax(300px, min(380px, calc(var(--vw, 1vw) * 34))); grid-template-rows: minmax(0, 1fr); }
html.land #stageWrap { aspect-ratio: auto; height: 100%; }

#toast { position: absolute; left: 50%; top: 46%; z-index: 3; transform: translate(-50%, -40%); opacity: 0; pointer-events: none; max-width: 94%; padding: 8px 18px; border-radius: 999px; text-align: center;
  font-family: var(--display); font-weight: 800; font-size: clamp(15px, calc(var(--vw, 1vw) * 4.2), 22px); background: var(--panel-solid); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
#toast.show { opacity: 1; transform: translate(-50%, -50%); }
#toast.win { border-color: var(--win); color: var(--win); }
#toast.post { border-color: var(--brass); color: var(--brass); }
#toast.lose { border-color: var(--lose); color: var(--lose); }
@media (prefers-reduced-motion: no-preference) { #toast { transition: opacity .25s, transform .25s; } }

#zoom { position: absolute; z-index: 4; left: 50%; bottom: 8px; transform: translateX(-50%); width: min(94%, 360px); padding: 10px 12px 12px; border-radius: 16px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); }
#zoom .zhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
#zoom .zname { font-family: var(--display); font-weight: 800; font-size: 18px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#zoom .znet { font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; }
#zoom .ibtn { width: 36px; height: 36px; margin-left: auto; box-shadow: none; }

/* ---------- console (the action area) ---------- */
.console { container-type: size; display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 14px; overflow: hidden; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: var(--shadow); }
.c-title { font-family: var(--display); font-weight: 800; font-size: clamp(20px, calc(var(--vw, 1vw) * 5.6), 26px); line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.c-fill { flex: 1; min-height: 0; }
.btn { min-height: 46px; padding: 8px 16px; border-radius: 12px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); }
.btn:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); color: var(--accent-ink); border-color: transparent; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 55%, #000), 0 8px 18px rgba(0,0,0,.25); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 55%, #000); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 38px; padding: 4px 12px; font-size: 14px; }
.btn.warn { background: color-mix(in srgb, var(--lose) 22%, transparent); color: var(--lose); border-color: var(--lose); }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.stepper { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px; gap: 8px; }
.stepper .btn { font-size: 24px; font-weight: 800; padding: 0; }
.bet-input { width: 100%; min-height: 46px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 28px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.bet-input::-webkit-outer-spin-button, .bet-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.err { min-height: 1.2em; color: var(--lose); font-weight: 600; font-size: 14px; }
.banner { padding: 10px 12px; border-radius: 12px; font-weight: 700; border-left: 6px solid var(--line); background: var(--panel2); }
.banner.win { color: var(--win); border-left-color: var(--win); background: color-mix(in srgb, var(--win) 16%, transparent); }
.banner.post { color: var(--brass); border-left-color: var(--brass); background: color-mix(in srgb, var(--brass) 16%, transparent); }
.banner.lose { color: var(--lose); border-left-color: var(--lose); background: color-mix(in srgb, var(--lose) 16%, transparent); }
.dots::after { content: ""; display: inline-block; width: 1.4em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
@media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "..."; } }

@container (max-height: 330px) {
  .console { gap: 7px; padding: 12px; }
  .c-title { font-size: 20px; }
  .c-sub { display: none; }
  .console .hand3d.big { --cw: clamp(34px, min(22cqw, 15cqh), 80px); }
  .btn.primary { min-height: 42px; }
  .stepper .btn, .bet-input { min-height: 40px; }
}
@container (max-height: 260px) { .quick { display: none; } }
@container (max-width: 380px) { .btn.primary { font-size: 15px; } }

/* ---------- 3D-style playing cards in the interface ---------- */
.hand3d { display: flex; align-items: center; justify-content: center; gap: calc(var(--cw, 56px) * .16); perspective: 800px; }
.hand3d.big { --cw: 64px; --cw: clamp(40px, min(26cqw, 20cqh), 104px); }
.hand3d.mini { --cw: 30px; gap: 4px; }
.hand3d.zoom { --cw: 78px; }
.pc { position: relative; width: var(--cw); aspect-ratio: 5 / 7; flex: none; display: grid; place-items: center; border-radius: calc(var(--cw) * .11); background: linear-gradient(160deg, #fffdf6, #f1ecda); color: #16231c;
  box-shadow: 0 calc(var(--cw) * .1) calc(var(--cw) * .22) rgba(0,0,0,.4), inset 0 0 0 1px #d4cdb6; font-family: var(--display); font-weight: 800; transform: rotateX(14deg); transform-origin: 50% 100%; }
.pc.red { color: #b3261e; }
.pc .r { position: absolute; left: 9%; top: 4%; font-size: calc(var(--cw) * .32); line-height: 1.1; }
.pc .s { font-size: calc(var(--cw) * .56); line-height: 1; margin-top: calc(var(--cw) * .12); }
.pc.gap { background: transparent; border: 2px dashed var(--line); box-shadow: none; color: var(--muted); font-weight: 600; transform: none; }
.pc.gap .q { font-size: calc(var(--cw) * .45); }
.pc.win { box-shadow: 0 0 0 3px var(--win), 0 0 24px var(--win); }
.pc.post { box-shadow: 0 0 0 3px var(--brass), 0 0 24px var(--brass); }
.pc.lose { box-shadow: 0 0 0 3px var(--lose), 0 0 24px var(--lose); }
@keyframes flipin { from { transform: rotateY(180deg) scale(.85); } to { transform: rotateX(14deg); } }
@media (prefers-reduced-motion: no-preference) { .pc.flip { animation: flipin .6s cubic-bezier(.2, .8, .2, 1); } }

/* ---------- setup ---------- */
.setup { position: absolute; inset: 0; display: grid; gap: 10px; grid-template-rows: auto minmax(0, 1fr) auto; padding: 14px; max-width: 560px; margin: 0 auto; }
.hero { display: grid; justify-items: center; gap: 4px; padding-top: 2px; }
.fan { position: relative; height: clamp(70px, calc(var(--vh, 1vh) * 17), 132px); width: 100%; perspective: 700px; }
.fan .pc { --cw: clamp(40px, calc(var(--vh, 1vh) * 9), 76px); position: absolute; left: 50%; top: 50%; transform-origin: 50% 90%; }
.fan .pc:nth-child(1) { transform: translate(-50%, -50%) translateX(calc(var(--cw) * -.85)) rotateZ(-14deg) rotateX(16deg); }
.fan .pc:nth-child(2) { transform: translate(-50%, -50%) translateY(calc(var(--cw) * -.1)) rotateX(16deg); background: repeating-linear-gradient(45deg, #9e2b25 0 7px, #7e211c 7px 14px); box-shadow: inset 0 0 0 3px #f2eddc, 0 8px 16px rgba(0,0,0,.4); }
.fan .pc:nth-child(3) { transform: translate(-50%, -50%) translateX(calc(var(--cw) * .85)) rotateZ(14deg) rotateX(16deg); }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, calc(var(--vw, 1vw) * 8.5), 52px); line-height: 1; letter-spacing: -.01em; }
.hero p { color: var(--muted); font-size: 15px; text-align: center; }
.sform { display: grid; gap: 10px; min-height: 0; align-content: start; }
.lbl span { white-space: nowrap; }
.lbl { font-weight: 600; font-size: 13px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pchip { display: flex; align-items: center; gap: 2px; height: clamp(32px, calc(var(--vh, 1vh) * 5.4), 42px); padding: 0 2px 0 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.pchip input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline-offset: 0; font-weight: 600; font-size: 15px; }
.pchip .x { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 8px; color: var(--muted); }
.pchip.add { justify-content: center; padding: 0 10px; border-style: dashed; font-weight: 600; color: var(--muted); background: transparent; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { min-height: 44px; border-radius: 10px; font-weight: 600; font-size: 14px; background: var(--panel2); border: 2px solid var(--line); padding: 4px 8px; line-height: 1.15; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 30%, transparent); border-color: var(--accent); }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 36px; font-size: 14px; justify-self: center; }
.pgmini { display: inline-flex; align-items: center; gap: 6px; }
.pgmini button { min-width: 30px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); font-size: 16px; line-height: 1; padding: 0; }
.pgmini button:disabled { opacity: .35; }
#setupErr:empty { display: none; }
html.short .hero p { display: none; }
html.short .fan { height: 62px; }
html.short .sform { gap: 8px; }
html.short .seg button { min-height: 38px; }
html.short .setup .stepper .btn, html.short .setup .bet-input { min-height: 40px; }
html.xshort .fan { display: none; }
html.xshort .setup { gap: 6px; padding: 10px 14px; }
html.xshort .hero h1 { font-size: 28px; }
html.land .setup { max-width: 920px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: 24px; align-items: center; }
html.land .hero { grid-row: 1; align-self: center; }
html.land .fan { height: clamp(90px, calc(var(--vh, 1vh) * 28), 190px); }
html.land .sform { grid-row: 1; grid-column: 2; align-self: center; }
html.land .setup > .linkbtn { grid-row: 2; grid-column: 1 / -1; }

/* ---------- menu sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 30; display: grid; place-items: end center; background: rgba(2, 8, 5, .62); }
.sheet-card { width: min(600px, 100%); height: calc(var(--vh, 1vh) * 78); height: min(calc(var(--vh, 1vh) * 78), 640px); display: flex; flex-direction: column; overflow: hidden; border-radius: 22px 22px 0 0; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
html.land .sheet { place-items: center; }
html.land .sheet-card { border-radius: 22px; height: calc(var(--vh, 1vh) * 88); height: min(calc(var(--vh, 1vh) * 88), 560px); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px 16px; }
.sheet-head h2 { font-family: var(--display); font-weight: 800; font-size: 22px; flex: 1; }
.sheet-head .ibtn { box-shadow: none; }
.tabs { display: flex; gap: 6px; padding: 0 12px 8px; }
.tabs button { flex: 1; min-height: 40px; border-radius: 10px; background: transparent; border: 1px solid var(--line); font-weight: 600; font-size: 14px; padding: 0 4px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0 12px 10px; }
.slist { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.srow { flex: none; height: var(--rh, 56px); display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 12px; background: var(--panel2); border: 1px solid transparent; overflow: hidden; min-width: 0; }
.srow.now { border-color: var(--accent); }
.srow.gone { opacity: .6; }
.srow .grow { flex: 1; min-width: 0; }

      muted = !!v;
      if (master) master.gain.value = muted ? 0 : 0.7;
      try { localStorage.setItem("inbetween-muted", muted ? "1" : "0"); } catch (e) { /* ignore */ }
    }
    return { play: play, unlock: unlock, setMuted: setMuted, isMuted: function () { return muted; } };
  })();
  function snd(name, delay, arg) {
    if (delay) setTimeout(function () { sfx.play(name, arg); }, delay); else sfx.play(name, arg);
  }




  /* ---------- the view of the game (what the screen shows) ---------- */
  function viewFrom(s, mode) {
    return {
      mode: mode, players: s.players, ante: s.ante, bank: s.bank, round: s.round, dealer: s.dealer, turn: s.turn, pos: s.pos,
      order: s.order, hands: s.hands, deckLeft: s.deckLeft, deckTotal: s.deckTotal, phase: s.phase, recollect: s.recollect,
      roundEnded: s.roundEnded, lastResult: s.lastResult, log: s.log, turnEndsAt: 0
    };
  }
  function sortedPair(h) { return E.sortedPair(h); }
  function cardName(c) { return RANKLBL[c.r] + SUITS[c.s]; }
  function gapOf(h) { return E.winningRanks(h.c1, h.c2); }
  function maxBet() { return E.maxBet(game.bank); }
  function activeList() { return game.players.filter(function (p) { return !p.left; }); }
  function pot() { return Math.max(game.ante, activeList().length * game.ante); }
  function isLive() { return game.phase === "bet" || game.phase === "drawing" || game.phase === "result" || game.phase === "focusing"; }
  function online() { return !!client && client.mode === "online"; }
  function mySeat() { return online() && net && net.me ? net.me.seat : -1; }
  function iAmHost() { return online() && net && net.me && net.hostId === net.me.id; }
  function isMyTurn() { return !online() || mySeat() === game.turn; }
  function canAct() { return !busy && !ui.waiting && game && game.phase === "bet" && isMyTurn(); }

  /* seats on the table are rotated online so that you sit at the bottom */
  function computeRot() {
    var N = game ? game.players.length : 0, me = mySeat();
    if (me < 0 || N < 2) return 0;
    return (((me - Math.ceil(N / 2)) % N) + N) % N;
  }
  function V(i) { var N = game.players.length; return ((i - rot) % N + N) % N; }
  function R(v) { var N = game.players.length; return (v + rot) % N; }

  /* ---------- playing events with animations ---------- */
  var queue = [], pendingState = null;

  function present(events) {
    for (var i = 0; i < events.length; i++) queue.push(events[i]);
    if (!busy) runQueue();
  }
  async function runQueue() {
    busy = true;
    for (;;) {
      if (pendingState) { var st = pendingState; pendingState = null; queue.length = 0; adoptState(st); continue; }
      if (!queue.length) break;
      var ev = queue.shift();
      try { await applyEvent(ev); } catch (err) { console.error(err); }
    }
    busy = false;
    render();
  }

  async function applyEvent(ev) {
    var g = game;
    if (!g) return;
    if (ev.log) g.log.push(ev.log);
    if (ev.e === "drawn" || ev.e === "pass" || ev.e === "turn") ui.waiting = false;
    switch (ev.e) {
      case "recollect":
        g.phase = "collecting"; render(); sfx.play("shuffle");
        await stage.collectAll();
        g.deckLeft = ev.deckLeft; g.deckTotal = ev.deckLeft;
        break;
      case "dealt": {
        g.dealer = ev.dealer; g.order = ev.order; g.pos = 0; g.hands = {};
        var seats = [];
        ev.order.forEach(function (i) {
          var a = ev.hands[i];
          g.hands[i] = { c1: a[0], c2: a[1], c3: null, state: "wait", outcome: null, bet: null };
          var sp = sortedPair(g.hands[i]);
          seats.push({ i: V(i), l: sp[0], r: sp[1] });
        });
        g.deckLeft = ev.deckLeft; g.phase = "dealing"; ui.zoomSeat = -1;
        render();
        await stage.dealAll(seats);
        break;
      }
      case "turn":
        g.turn = ev.seat; g.pos = ev.pos; ui.err = ""; ui.justDrew = false;
        ui.bet = String(Math.max(5, Math.min(g.ante, maxBet())));
        g.turnEndsAt = ev.deadline || 0;
        g.phase = "focusing"; render(); sfx.play("turn");
        await stage.focus(V(ev.seat));
        g.phase = "bet"; render();
        announce(g.players[ev.seat].name + (mySeat() === ev.seat ? ", it is your turn." : " is up."));
        break;
      case "drawn": {
        var h = g.hands[ev.seat];
        h.bet = ev.bet; g.phase = "drawing"; render();
        sfx.play("chips", Math.round(ev.bet / 5));
        await stage.reveal(V(ev.seat), ev.card, ev.big);
        h.c3 = ev.card; g.deckLeft = ev.deckLeft;
        break;
      }
      case "result": {
        var hh = g.hands[ev.seat];
        hh.outcome = ev.outcome; hh.state = "done";
        g.bank = ev.bank;
        ev.nets.forEach(function (n, i) { g.players[i].net = n; });
        g.lastResult = { kind: ev.outcome, text: ev.text }; g.roundEnded = ev.roundEnded;
        g.phase = "result"; ui.justDrew = true; g.turnEndsAt = 0;
        sfx.play(ev.outcome);
        stage.flash(ev.outcome, V(ev.seat));
        if (ev.outcome === "win") stage.burst(V(ev.seat)); else if (ev.outcome === "lose") stage.shake(V(ev.seat));
        stage.fly(ev.outcome === "win" ? "toPlayer" : "toBank", V(ev.seat), Math.round(ev.bet / 5));
        toast(ev.outcome === "win" ? "Between!  +" + fmt(ev.bet) : (ev.outcome === "post" ? "Hit a card  \u2212" : "Outside  \u2212") + fmt(ev.bet), ev.outcome);
        announce(ev.text);
        break;
      }
      case "pass":
        g.hands[ev.seat].state = "pass"; sfx.play("pass");
        break;
      case "left": {
        var p = g.players[ev.seat];
        p.left = true; p.net = ev.net;
        if (g.hands[ev.seat]) { g.hands[ev.seat].state = "left"; stage.discardHand(V(ev.seat)); }
        sfx.play("leave");
        break;
      }
      case "dealer": g.dealer = ev.dealer; break;
      case "dealEnd":
        if (ev.recollect) {
          g.phase = "collecting"; render(); sfx.play("shuffle");
          await stage.collectAll();
          g.deckLeft = ev.deckLeft; g.deckTotal = ev.deckLeft;
        } else { stage.discardAll(); g.deckLeft = ev.deckLeft; }
        g.hands = {}; g.order = [];
        break;
      case "ready": g.dealer = ev.dealer; g.turn = ev.turn; g.deckLeft = ev.deckLeft; g.phase = "ready"; g.turnEndsAt = 0; break;
      case "roundEnd":
        g.phase = "collecting"; render(); sfx.play("roundEnd"); sfx.play("shuffle");
        await stage.collectAll();
        break;
      case "newRound":
        g.round = ev.round; g.dealer = ev.dealer; g.turn = ev.turn; g.bank = ev.bank;
        ev.nets.forEach(function (n, i) { g.players[i].net = n; });
        g.deckLeft = ev.deckLeft; g.deckTotal = ev.deckLeft; g.hands = {}; g.order = []; g.roundEnded = false; g.phase = "ready";
        break;
      case "over":
        g.phase = "over"; g.hands = {}; g.order = []; stage.discardAll();
        openSheet("settle");
        break;
      case "presence":
        if (g.players[ev.seat]) g.players[ev.seat].connected = ev.connected;
        break;
      default: break;
    }
    render();
  }

  function toast(text, kind) {
    var t = $("toast");
    t.textContent = text; t.className = "show " + (kind || "");
    clearTimeout(timers.toast);
    timers.toast = setTimeout(function () { t.className = ""; }, 2400);
  }

  /* put the table into the state shown by the view, without animation */
  function placeTable() {
    if (!stage || !game) return;
    var onTable = 0, list = [];
    Object.keys(game.hands).forEach(function (k) {
      var h = game.hands[k];
      if (h.state === "left") return;
      onTable += 2 + (h.c3 ? 1 : 0);
      var sp = sortedPair(h);
      list.push({ i: V(+k), l: sp[0], r: sp[1], c3: h.c3 });
    });
    stage.reset(Math.max(0, game.deckTotal - game.deckLeft - onTable));
    stage.syncSeats(seatInfo());
    stage.setBank(game.bank, pot());
    stage.setDeck(game.deckLeft, game.deckTotal);
    stage.setHands(list);
    if (isLive()) stage.focus(V(game.turn));
  }

  /* ---------- one screen: the rules run in this browser ---------- */
  function createLocalClient(state) {
    var rng = E.cryptoRng();
    var c = {
      mode: "local", state: state,
      send: function (msg) {
        var g = c.state, r;
        if (msg.t === "deal") r = E.deal(g, rng);
        else if (msg.t === "bet") r = E.bet(g, g.turn, msg.amount);
        else if (msg.t === "pass") r = E.pass(g, g.turn, rng);
        else if (msg.t === "next") r = E.advance(g, rng);
        else if (msg.t === "leave") r = E.leave(g, msg.seat, rng);
        else return;
        if (!r.ok) { sfx.play("error"); toast(r.message, "lose"); return; }
        saveSetup();
        present(r.events);
      },
      close: function () {}
    };
    return c;
  }

  function startLocal() {
    var names = setup.names.map(function (n) { return n.trim(); }).filter(Boolean);
    var cfg = { names: names, ante: parseFloat(setup.ante), recollect: setup.recollect };
    var err = E.validateConfig(cfg);
    if (err) return err;
    var g = E.createGame(cfg, E.cryptoRng());
    client = createLocalClient(g);
    net = null; rot = 0;
    game = viewFrom(E.snapshot(g), "local");
    ui = { bet: "", err: "", justDrew: false, zoomSeat: -1 };
    queue.length = 0;
    saveSetup();
    render(); ensureStage(); placeTable(); render();
    return "";
  }

  /* ---------- online: the room server decides everything ---------- */
  function createOnlineClient(base, code, name) {
    var ws = null, v = 0, closed = false, tries = 0, everOpened = false, timer = null, ping = null;
    var tokenKey = "inbetween-token-" + code;
    var c = {
      mode: "online", code: code,
      send: function (msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); },
      close: function () { closed = true; clearTimeout(timer); clearInterval(ping); if (ws) { try { ws.close(); } catch (e) { /* ignore */ } } },
      connect: connect
    };
    function setStatus(s) { if (net) net.status = s; if (!game || !busy) render(); }
    function wsUrl() { return base.replace(/^http/, "ws") + "/ws/" + code; }
    function connect() {
      setStatus(tries ? "reconnecting" : "connecting");
      try { ws = new WebSocket(wsUrl()); } catch (e) { giveUp("That room address is not valid."); return; }
      ws.onopen = function () {
        everOpened = true; tries = 0;
        c.send({ t: "join", room: code, name: name, token: lsGet(tokenKey) });
        clearInterval(ping);
        ping = setInterval(function () { c.send({ t: "ping" }); }, 25000);
      };
      ws.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (err) { return; } onMessage(m); };
      ws.onclose = function (ev) {
        clearInterval(ping);
        if (closed) return;
        if (ev.code === 4404) { giveUp("That room has closed."); return; }
        if (ev.code === 4000) { giveUp(ev.reason === "replaced" ? "You opened this room in another tab." : "You left the room."); return; }
        if (!everOpened && tries >= 2) { giveUp("Could not reach that room. Check the code and try again."); return; }
        tries += 1;
        setStatus("reconnecting");
        timer = setTimeout(connect, Math.min(8000, 400 * Math.pow(2, tries)));
      };
      ws.onerror = function () { /* onclose follows */ };
    }
    function giveUp(msg) { exitOnline(msg); }
    function onMessage(m) {
      switch (m.t) {
        case "welcome":
          lsSet(tokenKey, m.you.token);
          net.me = m.you; net.status = "open"; v = m.state.v;
          onState(m.state);
          break;
        case "state": v = m.v; onState(m.state); break;
        case "events":
          if (m.v <= v) break;                                   // already seen
          if (m.v > v + 1) { c.send({ t: "sync" }); break; }     // missed something: ask for the whole picture
          v = m.v;
          m.events.forEach(function (e) { if (e.e === "turn" && e.ms) e.deadline = Date.now() + e.ms; });
          present(m.events);
          break;
        case "error":
          if (m.code === "started" || m.code === "full") { giveUp(m.msg); break; }
          ui.waiting = false; sfx.play("error"); toast(m.msg, "lose");
          break;
        default: break;
      }
    }
    function onState(st) {
      net.code = st.code; net.hostId = st.hostId; net.config = st.config; net.members = st.members; net.phase = st.phase;
      if (net.me) { var mine = st.members.find(function (x) { return x.id === net.me.id; }); if (mine) net.me.seat = mine.seat; }
      if (st.phase === "lobby") { game = null; queue.length = 0; if (stage) stage.reset(0); render(); return; }
      if (busy) { pendingState = st; return; }
      adoptState(st);
    }
    return c;
  }

  // Replace the whole view with the room's current public picture (join, reconnect, or after a missed update).
  function adoptState(st) {
    var first = !game;
    game = viewFrom(st.game, "online");
    game.turnEndsAt = st.turnMs ? Date.now() + st.turnMs : 0;
    st.members.forEach(function (m, i) { if (game.players[i]) game.players[i].connected = m.connected; });
    rot = computeRot();
    render();
    ensureStage();
    placeTable();
    if (game.phase === "over") { openSheet("settle"); }
    else if (first) closeSheet();
    render();
  }

  function joinRoom(code) {
    var base = serverBase();
    var name = (setup.name || "").trim();
    if (!name) { homeMsg = "Type your name first."; render(); return; }
    lsSet("inbetween-name", name);
    if (client) client.close();
    game = null; rot = 0; queue.length = 0;
    net = { code: code, hostId: null, members: [], config: { ante: 10, recollect: "round", turnSeconds: 60, autoDeal: true }, phase: "lobby", me: null, status: "connecting" };
    client = createOnlineClient(base, code, name);
    try { history.replaceState(null, "", "#/room/" + code); } catch (e) { /* ignore */ }
    homeMsg = "";
    render();
    client.connect();
  }

  async function createRoom() {
    var base = serverBase();
    var name = (setup.name || "").trim();
    if (!name) { homeMsg = "Type your name first."; render(); return; }
    homeMsg = "Creating your room..."; render();
    try {
      var res = await fetch(base + "/api/rooms", { method: "POST" });
      if (!res.ok) throw new Error("bad status " + res.status);
      var d = await res.json();
      joinRoom(d.code);
    } catch (e) {
      homeMsg = "Could not reach the room server. Check its address and try again."; render();
    }
  }

  function exitOnline(msg) {
    var code = net && net.code;
    if (client) { client.close(); }
    if (code) lsDel("inbetween-token-" + code);
    client = null; net = null; game = null; rot = 0; queue.length = 0; pendingState = null; busy = false;
    ui = { bet: "", err: "", justDrew: false, zoomSeat: -1 };
    sheet.open = false;
    if (stage) stage.reset(0);
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* ignore */ }
    homeMsg = msg || "";
    setup.mode = "online";
    render();
    renderSheet();
  }


  /* ---------- rendering: game ---------- */
  function cardEl(c, extra) {
    var red = c.s === 1 || c.s === 2;
    return '<div class="pc' + (red ? " red" : "") + (extra ? " " + extra : "") + '"><span class="r">' + RANKLBL[c.r] + '</span><span class="s">' + SUITS[c.s] + '</span></div>';
  }
  function handEl(h, size, flipMid, pulse) {
    var sp = sortedPair(h);
    var mid = h.c3 ? cardEl(h.c3, (h.outcome || "") + (flipMid ? " flip" : "")) : '<div class="pc gap' + (pulse ? " pulse" : "") + '"><span class="q">?</span></div>';
    return '<div class="hand3d ' + size + '" role="group" aria-label="Cards ' + cardName(sp[0]) + (h.c3 ? ", " + cardName(h.c3) : "") + ", " + cardName(sp[1]) + '">' + cardEl(sp[0]) + mid + cardEl(sp[1]) + '</div>';
  }

  function hudHTML() {
    var conn = online() && net && net.status !== "open"
      ? '<div class="pill warnpill"><small>Connection</small><b>' + (net.status === "reconnecting" ? "Reconnecting" : "Connecting") + '</b></div>' : "";
    return '<button class="ibtn" data-act="openSheet" aria-label="Open menu">' + ICON.menu + '</button>' +
      '<div class="bank" role="group" aria-label="Bank"><span class="chip"></span><span><small>Bank</small><strong>' + fmt(game.bank) + '</strong></span></div>' +
      '<span class="spacer"></span>' + conn +
      '<div class="pill"><small>Round</small><b>' + game.round + '</b></div>' +
      '<div class="pill deckpill"><small>Deck</small><b>' + game.deckLeft + '</b></div>' +
      '<button class="ibtn" data-act="mute" aria-pressed="' + sfx.isMuted() + '" aria-label="' + (sfx.isMuted() ? "Turn sound on" : "Turn sound off") + '">' + (sfx.isMuted() ? ICON.off : ICON.on) + '</button>';
  }

  function consoleHTML() {
    var ph = game.phase, dealer = game.players[game.dealer], on = online();
    if (ph === "over") {
      var w = activeList()[0];
      return '<div><div class="c-title">Game over</div><div class="c-sub">' + (w ? esc(w.name) + " is the last player at the table." : "Everyone has left.") + ' Settle up to see who pays whom.</div></div><div class="c-fill"></div>' +
        '<div class="row"><button class="btn primary" data-act="openSettle" style="flex:2">Settle up</button>' +
        (on ? (iAmHost() ? '<button class="btn" data-act="backToLobby">Back to lobby</button>' : '<button class="btn" data-act="leaveRoom">Leave</button>') : "") + '</div>';
    }
    if (ph === "ready") {
      var first = game.players[E.nextActive(game, game.dealer)];
      var canDeal = !on || mySeat() === game.dealer || iAmHost();
      var auto = on && net && net.config && net.config.autoDeal;
      var title = !on || canDeal ? esc(dealer.name) + ' deals' : 'Waiting for ' + esc(dealer.name);
      var sub = 'Two cards each, face up. ' + esc(first.name) + ' bets first.' + (auto ? ' The deal also starts by itself in a moment.' : '');
      return '<div><div class="c-title">' + title + '</div><div class="c-sub">' + sub + '</div></div><div class="c-fill"></div>' +
        (canDeal ? '<button class="btn primary" data-act="deal">Deal two cards to everyone</button>' : '<div class="c-sub">' + esc(dealer.name) + ' deals next<span class="dots"></span></div>');
    }
    if (ph === "dealing") return '<div><div class="c-title">Dealing</div><div class="c-sub">' + esc(dealer.name) + ' deals two cards to every player<span class="dots"></span></div></div>';
    if (ph === "collecting") return '<div><div class="c-title">Collecting the cards</div><div class="c-sub">Every card goes back into the deck and is shuffled<span class="dots"></span></div></div>';
    var p = game.players[game.turn], h = game.hands[game.turn];
    var mine = isMyTurn(), prog = "Hand " + (game.pos + 1) + " of " + game.order.length + ".";
    var head = '<div class="c-title">' + (on && mine ? "Your turn" : esc(p.name) + '\u2019s turn') + '</div>';
    if (!h) return '<div>' + head + '</div>';
    if (ph === "focusing") return '<div>' + head + '<div class="c-sub">' + prog + '</div></div>';
    if (ph === "drawing") return '<div>' + head + '<div class="c-sub">Bet ' + fmt(h.bet) + '. Here comes the betting card<span class="dots"></span></div></div>' + handEl(h, "big", false, true);
    if (ph === "result") {
      var r = game.lastResult || { kind: "info", text: "" };
      var extra = "", label = game.pos + 1 < game.order.length ? "Next player" : "Finish this deal";
      if (game.roundEnded) {
        var nd = game.players[E.nextActive(game, game.dealer)];
        extra = '<div class="c-sub">The bank is empty, so round ' + game.round + ' ends. All cards are recollected, everyone adds the boat of ' + fmt(game.ante) + ', and ' + esc(nd.name) + ' deals.</div>';
        label = "Start round " + (game.round + 1);
      }
      var canNext = !on || mySeat() === game.turn || iAmHost();
      var html = handEl(h, "big", ui.justDrew) + '<div class="banner ' + r.kind + '" role="status">' + esc(r.text) + '</div>' + extra + '<div class="c-fill"></div>' +
        (canNext ? '<button class="btn primary" data-act="next">' + label + '</button>' : '<div class="c-sub">Next up in a moment<span class="dots"></span></div>');
      ui.justDrew = false;
      return html;
    }
    /* bet phase */
    var g = gapOf(h), sub = prog + " " + (g === 0 ? "No rank can win this hand." : g + (g === 1 ? " rank wins." : " ranks win.")) + ' <span class="timer" id="timer"></span>';
    if (!mine) return '<div>' + head + '<div class="c-sub">' + prog + ' Waiting for ' + esc(p.name) + ' to bet <span class="timer" id="timer"></span></div></div>' + handEl(h, "big", false, false);
    return '<div>' + head + '<div class="c-sub">' + sub + '</div></div>' +
      handEl(h, "big", false) +
      '<div class="stepper"><button class="btn" data-act="step" data-d="-5" aria-label="Lower bet by 5">\u2212</button>' +
      '<input id="bet" class="bet-input" type="number" inputmode="numeric" min="5" max="' + maxBet() + '" step="5" value="' + esc(ui.bet) + '" aria-label="Your bet, multiples of 5">' +
      '<button class="btn" data-act="step" data-d="5" aria-label="Raise bet by 5">+</button></div>' +
      '<div class="row quick"><button class="btn small" data-act="quick" data-k="min">Min</button><button class="btn small" data-act="quick" data-k="boat">Boat</button><button class="btn small" data-act="quick" data-k="half">Half</button><button class="btn small" data-act="quick" data-k="max">Max</button></div>' +
      '<div class="c-fill"></div>' +
      '<div class="row"><button class="btn primary" id="goBtn" data-act="play" style="flex:2">' + betLabel() + '</button><button class="btn" data-act="pass">Pass</button></div>';
  }
  function betLabel() { var b = parseFloat(ui.bet); return b > 0 ? "Bet " + fmt(b) + " and draw" : "Bet and draw"; }
  function setBet(v) {
    var m = maxBet();
    v = Math.max(5, Math.min(m, Math.round(v / 5) * 5));
    ui.bet = String(v); ui.err = "";
    var inp = $("bet"); if (inp) inp.value = ui.bet;
    var gb = $("goBtn"); if (gb) gb.textContent = betLabel();
  }
  function tickTimer() {
    var el = $("timer");
    if (!el || !game) return;
    if (game.phase === "bet" && game.turnEndsAt) {
      var s = Math.max(0, Math.ceil((game.turnEndsAt - Date.now()) / 1000));
      el.textContent = "(" + s + "s left)"; el.className = "timer" + (s <= 10 ? " low" : "");
    } else el.textContent = "";
  }

  /* what the stage needs, in visual seat order (you at the bottom when online) */
  function seatInfo() {
    var N = game.players.length, live = isLive(), arr = new Array(N);
    game.players.forEach(function (p, i) {

      if (e.target.id === "bet" && game && game.phase === "bet") { e.preventDefault(); playBet(); }
      else if (e.target.id === "joincode") { e.preventDefault(); var b = document.querySelector('[data-act="joinCode"]'); if (b) b.click(); }
      else if (e.target.id === "myname") { e.preventDefault(); var c = document.querySelector('[data-act="createRoom"]'); if (c) c.click(); }
    }
  });

  window.addEventListener("resize", function () { if (sheet.open) fillSheetBody(); });

  /* ---------- start up ---------- */
  setup.name = lsGet("inbetween-name") || "";
  loadSaved();
  if (!setup.name) setup.name = lsGet("inbetween-name") || "";
  var invited = /#\/room\/([A-HJKMNP-Z2-9]{5})/.exec(location.hash || "");
  if (invited) {
    setup.mode = "online"; setup.code = invited[1]; game = null; client = null;
    if (serverBase() && setup.name && lsGet("inbetween-token-" + invited[1])) joinRoom(invited[1]);
  }
  render();
  if (game && client && client.mode === "local") { ensureStage(); placeTable(); render(); }
  setInterval(tickTimer, 500);
})();

</script>
</body>
</html>
